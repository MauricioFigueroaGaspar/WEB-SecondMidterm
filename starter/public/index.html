<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <!-- The whole page is a Pokedex device -->
  <main class="container py-3">
    <div class="pokedex-frame p-3 p-md-4 shadow">

      <!-- Top of the Pokedex: lights, title and search -->
      <div class="row align-items-center g-3 mb-3">
        <div class="col-12 col-md-4 d-flex align-items-center gap-2">
          <span class="light light-big"></span>
          <span class="light light-red"></span>
          <span class="light light-yellow"></span>
          <span class="light light-green"></span>
        </div>
        <div class="col-12 col-md-4 text-center">
          <a class="pokedex-title d-inline-flex align-items-center gap-2" href="#" id="brand-reset">
            <span class="pokeball"></span> Pokedex
          </a>
        </div>
        <div class="col-12 col-md-4">
          <form id="search-form" role="search">
            <div class="input-group">
              <input class="form-control" type="search" id="search-input" placeholder="Search by name or ID..."
                aria-label="Search">
              <button class="btn btn-dark" type="submit">Search</button>
              <button class="btn btn-outline-light d-none" type="button" id="clear-search-btn">Reset</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div id="loading-spinner" class="text-center my-5 d-none">
        <div class="spinner-border text-light" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-white">Loading Pokemon...</p>
      </div>

      <!-- Error Screen -->
      <div id="error-view" class="alert alert-warning text-center my-4 d-none" role="alert">
        <h4 class="alert-heading fw-bold">Pokemon Not Found!</h4>
        <p id="error-message">The requested Pokemon does not exist in the Pokedex.</p>
        <hr>
        <button class="btn btn-danger" id="error-reset-btn">Return to Full Catalog</button>
      </div>

      <!-- Scrollable Catalog Grid (the Pokedex screen) -->
      <section id="catalog-section">
        <div class="d-flex justify-content-between align-items-center mb-3 text-white">
          <h5 class="mb-0 fw-bold" id="catalog-subtitle">Catalog</h5>
          <span class="badge rounded-pill bg-dark" id="catalog-count">0 entries</span>
        </div>
        <div class="catalog-scroll-container pokedex-screen p-3">
          <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="catalog-grid">
            <!-- Dynamically populated via app.js -->
          </div>
        </div>
      </section>

      <footer class="text-center text-white small mt-3">
        Data provided by <a href="https://pokeapi.co/" class="link-light" target="_blank">PokeAPI</a>
      </footer>
    </div>
  </main>

  <!-- Detail Modal with Left/Right Navigation -->
  <div class="modal fade" id="characters-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-danger text-white" id="modal-header">
          <h5 class="modal-title fw-bold text-capitalize" id="modal-name">Character Name</h5>
          <span class="badge bg-dark ms-2 fs-6" id="modal-id">#000</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body p-4">
          <div class="row align-items-center">
            <!-- Left Column: Sprite & Types -->
            <div class="col-md-5 text-center mb-3 mb-md-0">
              <div class="sprite-wrapper p-3 mb-3">
                <img id="modal-img" src="" alt="Character Sprite" class="img-fluid characters-detail-img">
              </div>
              <div id="modal-types" class="d-flex justify-content-center gap-2 flex-wrap"></div>
            </div>

            <!-- Right Column: Stats, Abilities, Moves, Characteristics, etc. -->
            <div class="col-md-7">
              <div class="row g-2 text-center mb-3">
                <div class="col-4">
                  <div class="p-2 border rounded bg-body-tertiary">
                    <small class="text-secondary d-block">Experience</small>
                    <span class="fw-bold" id="modal-exp">-</span>
                  </div>
                </div>
                <div class="col-4">
                  <div class="p-2 border rounded bg-body-tertiary">
                    <small class="text-secondary d-block">Height</small>
                    <span class="fw-bold" id="modal-height">-</span>
                  </div>
                </div>
                <div class="col-4">
                  <div class="p-2 border rounded bg-body-tertiary">
                    <small class="text-secondary d-block">Weight</small>
                    <span class="fw-bold" id="modal-weight">-</span>
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <h6 class="fw-bold text-secondary mb-1">Abilities</h6>
                <div id="modal-abilities" class="d-flex flex-wrap gap-1"></div>
              </div>

              <div>
                <h6 class="fw-bold text-secondary mb-1">Moves</h6>
                <div id="modal-moves"
                  class="moves-scroll-box p-2 border rounded bg-body-tertiary d-flex flex-wrap gap-1"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer d-flex justify-content-between bg-body-tertiary">
          <button type="button" class="btn btn-outline-secondary px-4" id="prev-btn">
            &larr; Previous
          </button>
          <span class="text-secondary small">Use Left / Right arrows to navigate</span>
          <button type="button" class="btn btn-outline-secondary px-4" id="next-btn">
            Next &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>

</html>
